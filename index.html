<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>nxsssv</title>
    <link rel="icon" type="image/x-icon" href="ico.png">
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        :root {
            --accent-color: #ff0055;
            --bg-dark: #050505;
            --glass-bg: rgba(10, 10, 10, 0.75);
            --glass-border: rgba(255, 0, 85, 0.2);
            --pfp-image: url('загрузка.gif');
            --status-color: #747f8d;
        }

        * { cursor: none !important; }

        body {
            margin: 0;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a050a 0%, #050505 100%);
            font-family: 'JetBrains Mono', monospace;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        #particles-js {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 0;
        }

        /* --- LOADER --- */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        
        #loader.hidden { opacity: 0; visibility: hidden; }

        .loader-content { text-align: center; animation: pulse 2s infinite; }
        .loader-text {
            font-size: 1.2rem;
            letter-spacing: 10px;
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-color);
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        #cursor {
            width: 8px; height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 15px var(--accent-color), 0 0 30px var(--accent-color);
            transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        /* --- ПЛЕЕР С ПЛЕЙЛИСТОМ --- */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 260px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-info { display: flex; align-items: center; gap: 12px; }
        .track-img {
            width: 45px; height: 45px;
            border-radius: 50%;
            border: 1px solid var(--accent-color);
            background-size: cover;
            background-position: center;
            animation: rotate 8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .track-details { overflow: hidden; }
        .track-name { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .track-artist { font-size: 0.6rem; color: var(--accent-color); opacity: 0.8; }

        #visualizer { width: 100%; height: 35px; display: block; margin: 5px 0; }
        
        .player-controls { display: flex; flex-direction: column; gap: 10px; }
        
        .playback-btns { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 5px; }
        .control-btn { background: none; border: none; color: #fff; cursor: pointer !important; font-size: 1rem; transition: 0.3s; opacity: 0.7; }
        .control-btn:hover { opacity: 1; color: var(--accent-color); transform: scale(1.1); }
        .play-pause-btn { font-size: 1.4rem; opacity: 1; }

        .progress-container { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; cursor: pointer !important; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent-color); box-shadow: 0 0 8px var(--accent-color); }

        .volume-container { display: flex; align-items: center; gap: 8px; }
        .volume-container i { font-size: 0.7rem; color: var(--accent-color); }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 3px; cursor: pointer; background: rgba(255, 255, 255, 0.1); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { height: 10px; width: 10px; border-radius: 50%; background: var(--accent-color); cursor: pointer; -webkit-appearance: none; margin-top: -3.5px; box-shadow: 0 0 5px var(--accent-color); }

        /* --- КАРТОЧКА --- */
        .bio-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 30px;
            width: 380px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            z-index: 1;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .avatar-container { position: relative; width: 100%; height: 180px; margin-bottom: 25px; transform: translateZ(50px); }
        .avatar-box { width: 100%; height: 100%; border-radius: 10px; border: 2px solid var(--status-color); background-image: var(--pfp-image); background-size: cover; background-position: center; transition: border-color 0.5s ease; box-shadow: 0 0 15px var(--status-color); }

        .username { font-size: 2.4rem; font-weight: 700; text-transform: uppercase; letter-spacing: 5px; margin: 0; text-shadow: 0 0 10px var(--accent-color); transform: translateZ(30px); }
        .username:hover { animation: glitch 0.3s linear infinite; }

        @keyframes glitch {
            0% { text-shadow: 2px 0 #ff0055, -2px 0 #00ffff; transform: translate(0); }
            25% { text-shadow: -2px 0 #ff0055, 2px 0 #00ffff; transform: translate(-1px, 1px); }
            50% { text-shadow: 2px 0 #ff0055, -2px 0 #00ffff; transform: translate(-1px, -1px); }
            75% { text-shadow: -2px 0 #ff0055, 2px 0 #00ffff; transform: translate(1px, 1px); }
            100% { text-shadow: 2px 0 #ff0055, -2px 0 #00ffff; transform: translate(0); }
        }

        .description { font-size: 0.85rem; opacity: 0.6; margin: 10px 0; min-height: 1.2em; transform: translateZ(20px); }
        
        .skills-container { margin: 20px 0; transform: translateZ(40px); text-align: left; background: rgba(255, 255, 255, 0.02); padding: 15px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .skills-title { font-size: 0.7rem; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }
        .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .skill-tag { font-size: 0.65rem; background: rgba(255, 255, 255, 0.05); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1); color: #ccc; transition: 0.3s; }
        .skill-tag:hover { border-color: var(--accent-color); color: #fff; background: rgba(255, 0, 85, 0.1); }

        /* --- PROJECT SECTION --- */
        .project-section { margin: 15px 0 20px 0; transform: translateZ(45px); text-align: left; }
        .project-card { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 10px; padding: 12px; text-decoration: none; color: white; transition: all 0.3s ease; }
        .project-card:hover { background: rgba(255, 0, 85, 0.05); border-color: var(--accent-color); box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); transform: translateY(-2px); }
        .project-icon { font-size: 1.8rem; color: var(--accent-color); }
        .project-info { display: flex; flex-direction: column; }
        .project-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; }
        .project-name { font-size: 0.85rem; font-weight: bold; color: #eee; }
        .project-meta { font-size: 0.65rem; color: var(--accent-color); margin-top: 2px; }

        #discord-activity { font-size: 0.7rem; color: var(--status-color); margin-bottom: 25px; font-style: italic; transform: translateZ(25px); min-height: 14px; }
        
        .links { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; transform: translateZ(60px); padding: 0 10px; }
        .icon-btn { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; color: #888; font-size: 1.4rem; text-decoration: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; pointer-events: auto !important; }
        .icon-btn:hover { color: #fff; border-color: var(--accent-color); background: rgba(255, 0, 85, 0.1); box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); transform: translateY(-5px) scale(1.05); }
        .copy-status { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); color: var(--accent-color); font-weight: bold; font-size: 0.6rem; opacity: 0; transition: 0.3s; pointer-events: none; white-space: nowrap; }
        .icon-btn.copied .copy-status { opacity: 1; bottom: -20px; }
        .icon-btn.copied i { opacity: 0.2; }

        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 10; }
        .sparkles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .sparkle { position: absolute; background-color: var(--accent-color); border-radius: 50%; opacity: 0; animation: sparkle-fall linear infinite, sparkle-pulse ease-in-out infinite; }
        @keyframes sparkle-fall { 0% { transform: translateY(0); } 100% { transform: translateY(100vh); } }
        @keyframes sparkle-pulse { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.8; } }
        .sparkle:nth-child(1) { width: 3px; height: 3px; left: 10%; animation-duration: 8s, 1s; }
        .sparkle:nth-child(2) { width: 2px; height: 2px; left: 30%; animation-duration: 10s, 1.2s; }
        .sparkle:nth-child(3) { width: 4px; height: 4px; left: 50%; animation-duration: 7s, 0.9s; }
        .sparkle:nth-child(4) { width: 3px; height: 3px; left: 70%; animation-duration: 9s, 1.1s; }
        .sparkle:nth-child(5) { width: 2px; height: 2px; left: 90%; animation-duration: 12s, 1.3s; }
    </style>
</head>
<body onclick="startExperience()">

<div id="loader">
    <div class="loader-content">

    <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
</div>

<div class="music-player">
    <div class="track-info">
        <div class="track-img" id="track-img"></div>
        <div class="track-details">
            <div class="track-name" id="track-name">Loading...</div>

        <a href="https://www.instagram.com/hypxrtensxxn/" class="icon-btn" title="Instagram" onmouseenter="playSfx('hover')" onclick="playSfx('click'); event.stopPropagation();" target="_blank">
            <i class="fab fa-instagram"></i>

            <i class="fab fa-github"></i>

<script>
    // --- ПЛЕЙЛИСТ ---
    const playlist = [
        {
            name: "watch the planets",
            artist: "Nato Kitch",
            src: "music.mp3",
            cover: "track-cover.jpg"
        },
        {
            name: "gym class",
            artist: "Lil Peep",
            src: "lil peep - gym class.mp3",
            cover: "ab67616d0000b273a8bf8f0ea36fdac6eb15d7a6.jpg"
        },
        {
            name: "big glocks",
            artist: "Pouya & Fat Nick",
            src: "Big Glocks.mp3",
            cover: "81WKr3uIdmL._UXNaN_FMjpg_QL85_.jpg"
        },
        {
            name: "stereo love",
            artist: "Edward Maya & Vika Jigulina",
            src: "Edward Maya & Vika Jigulina - Stereo Love (Official Music Video).mp3",
            cover: "Edward_maya_stereo_love_cover.jpg"
        },
        {
            name: "stephanie",
            artist: "Nafeesisboujee",
            src: "Stephanie.mp3",
            cover: "ab67616d0000b2733bda019c02edcbacd8b22417.jpg"
        },
        {
            name: "i smoked away my brain",
            artist: "A$AP Rocky",
            src: "A$AP Rocky - I Smoked Away My Brain (I'm God x Demons Mashup) (Audio) ft. Imogen Heap, Clams Casino.mp3",
            cover: "ab67616d00001e02c8ced8a4d6b6b61eb592f3dd.jpg"
        },
        {
            name: "home",
            artist: "Toby Fox",
            src: "012. Home (UNDERTALE Soundtrack) - Toby Fox.mp3",
            cover: "artworks-000355398444-magzyk-t500x500.jpg"
        }
    ];

    let currentTrackIndex = 0;
    const audio = document.getElementById('myAudio');
    const playBtn = document.getElementById('play-btn');

    function loadTrack(index) {
        const track = playlist[index];
        audio.src = track.src;
        document.getElementById('track-name').innerText = track.name;
        document.getElementById('track-artist').innerText = track.artist;
        document.getElementById('track-img').style.backgroundImage = `url('${track.cover}')`;
        audio.load();
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().catch(e => console.log(e));
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        } else {
            audio.pause();
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
    }

    function nextTrack() {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
        loadTrack(currentTrackIndex);
        audio.play();
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
    }

    function prevTrack() {
        currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
        loadTrack(currentTrackIndex);
        audio.play();
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
    }

    function seekTrack(e) {
        const percent = e.offsetX / e.currentTarget.offsetWidth;
        audio.currentTime = percent * audio.duration;
    }

    audio.onended = nextTrack;

    // --- ОСТАЛЬНАЯ ЛОГИКА ---
    const sfx = {
        hover: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
        click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
        copy: new Audio('https://assets.mixkit.co/active_storage/sfx/1118/1118-preview.mp3')
    };

    function playSfx(type) { sfx[type].currentTime = 0; sfx[type].play().catch(() => {}); }

    function startExperience() {
        const loader = document.getElementById('loader');
        if (!loader.classList.contains('hidden')) {
            loader.classList.add('hidden');
            loadTrack(currentTrackIndex);
            audio.play();
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            typeWriter();
            initParticles();
            initAudioContext();
        }
    }

    function initParticles() {
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ff0055" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#ff0055", "opacity": 0.1, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "out_mode": "out" }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "grab" }, "resize": true } },
            "retina_detect": true
        });
    }

    VanillaTilt.init(document.querySelector(".bio-card"), { max: 10, speed: 1000, glare: true, "max-glare": 0.2 });

    const userID = "423133284525015041";
    function updateLanyard() {
        fetch(`https://api.lanyard.rest/v1/users/${userID}`)
            .then(r => r.json())
            .then(d => {
                const { discord_status, activities } = d.data;
                const colors = { online: "#43b581", idle: "#faa61a", dnd: "#f04747", offline: "#747f8d" };
                const avatarBox = document.getElementById('avatar-box');
                const activityText = document.getElementById('discord-activity');
                const color = colors[discord_status] || colors.offline;
                avatarBox.style.borderColor = color;
                avatarBox.style.boxShadow = `0 0 15px ${color}`;
                if (activities.length > 0) {
                    const main = activities.find(a => a.type === 0) || activities[0];
                    activityText.innerText = `Playing: ${main.name}`;
                    activityText.style.color = color;
                } else {
                    activityText.innerText = discord_status.toUpperCase();
                    activityText.style.color = color;
                }
            });
    }
    setInterval(updateLanyard, 30000); updateLanyard();

    const progressBar = document.getElementById('progress-bar');
    const volumeSlider = document.getElementById('volume-slider');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    let audioCtx, analyser, source, dataArray, initialized = false;

    volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);

    function initAudioContext() {
        if (initialized) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        initialized = true;
        draw();
    }

    function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = (canvas.width / dataArray.length) * 2.5;
        let x = 0;
        for (let i = 0; i < dataArray.length; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
            x += barWidth;
        }
    }

    audio.ontimeupdate = () => {
        if (audio.duration) progressBar.style.width = (audio.currentTime / audio.duration) * 100 + '%';
    };

    document.addEventListener('mousemove', (e) => {
        const cursor = document.getElementById('cursor');
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    function copyDiscord(id, el) {
        navigator.clipboard.writeText(id).then(() => {
            playSfx('copy');
            el.classList.add('copied');
            setTimeout(() => el.classList.remove('copied'), 2000);
        });
    }

    const textStr = "coder from midgard";
    let idx = 0;
    function typeWriter() {
        if (idx < textStr.length) {
            document.getElementById("typewriter").innerHTML += textStr.charAt(idx);
            idx++; setTimeout(typeWriter, 100);
        }
    }
</script>
</body>
</html>
